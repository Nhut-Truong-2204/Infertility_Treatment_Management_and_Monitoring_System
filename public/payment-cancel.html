<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán bị hủy</title>
    <link rel="icon" href="/favicon.ico" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fef2f2 0%, #fff 60%, #dbeafe 100%);
        }

        .cancel-container {
            background: #fff;
            border-radius: 1.25rem;
            box-shadow: 0 8px 32px 0 rgba(239, 68, 68, 0.08), 0 1.5px 6px 0 rgba(59, 130, 246, 0.05);
            padding: 2rem;
            max-width: 28rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1.5px solid #fecaca;
            margin-top: 4rem;
        }

        .icon-cancel {
            width: 4rem;
            height: 4rem;
            color: #ef4444;
            margin-bottom: 1rem;
            display: block;
        }

        .title-cancel {
            font-size: 1.5rem;
            font-weight: bold;
            color: #b91c1c;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .desc-cancel {
            color: #374151;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1rem;
            line-height: 1.6;
        }

        .btn {
            width: 100%;
            font-weight: bold;
            border-radius: 0.5rem;
            padding: 0.75rem 0;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            margin-bottom: 0.5rem;
        }

        .btn-outline {
            background: #fff;
            color: #374151;
            border: 1.5px solid #d1d5db;
        }

        .btn-outline:hover {
            background: #f3f4f6;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
            margin-bottom: 0;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="cancel-container">
        <svg class="icon-cancel" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" />
            <path d="M15 9l-6 6M9 9l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        <h1 class="title-cancel">Thanh toán bị hủy</h1>
        <p class="desc-cancel">
            Giao dịch của bạn đã bị hủy hoặc không thành công.<br />
            Nếu cần hỗ trợ, vui lòng liên hệ phòng khám.
        </p>
        <button onclick="window.location.href='/customer/dashboard'" class="btn btn-outline">
            Quay lại trang Dashboard
        </button>
    </div>
</body>

</html>
