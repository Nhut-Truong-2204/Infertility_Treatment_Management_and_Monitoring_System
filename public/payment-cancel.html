<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán bị hủy</title>
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="icon" href="/favicon.ico" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body
    class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-red-50 via-white to-blue-50 font-onest">
    <div
        class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full flex flex-col items-center border border-red-100 mt-16">
        <svg class="w-16 h-16 text-red-500 mb-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" />
            <path d="M15 9l-6 6M9 9l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        <h1 class="text-2xl font-bold text-red-700 mb-2">Thanh toán bị hủy</h1>
        <p class="text-gray-700 mb-6 text-center">
            Giao dịch của bạn đã bị hủy hoặc không thành công.<br />
            Nếu cần hỗ trợ, vui lòng liên hệ phòng khám.
        </p>
        <button onclick="window.location.href='/customer/appointments'"
            class="w-full mb-2 border border-gray-300 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-50 transition-colors duration-200">
            Quay lại lịch hẹn
        </button>
        <button onclick="window.location.href='/customer/treatment-contracts'"
            class="w-full bg-primary hover:bg-accent text-white font-bold py-3 rounded-lg transition-colors duration-200">
            Xem hợp đồng điều trị
        </button>
    </div>
</body>

</html>

<!--
  Trang này sẽ hiển thị đúng khi truy cập /payment-cancel.html hoặc /payment-cancel.html?status=cancel
  Không cần thay đổi gì thêm, query string không ảnh hưởng đến nội dung trang tĩnh.
