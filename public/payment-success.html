<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán thành công</title>
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="icon" href="/favicon.ico" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body
    class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-green-50 via-white to-blue-50 font-onest">
    <div
        class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full flex flex-col items-center border border-green-100 mt-16">
        <svg class="w-16 h-16 text-green-500 mb-4" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" />
            <path d="M9 12l2 2l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        <h1 class="text-2xl font-bold text-green-700 mb-2">Thanh toán thành công!</h1>
        <p class="text-gray-700 mb-6 text-center">
            Cảm ơn bạn đã thanh toán. Giao dịch của bạn đã được xác nhận.<br />
            Nếu có thắc mắc, vui lòng liên hệ phòng khám để được hỗ trợ.
        </p>
        <button onclick="window.location.href='/customer/appointments'"
            class="w-full mb-2 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition-colors duration-200">
            Xem lịch hẹn
        </button>
        <button onclick="window.location.href='/customer/treatment-contracts'"
            class="w-full bg-primary hover:bg-accent text-white font-bold py-3 rounded-lg transition-colors duration-200">
            Xem hợp đồng điều trị
        </button>
    </div>
</body>

</html>
